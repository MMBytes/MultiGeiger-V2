# Release workflow — fire on tag push, build all 11 boards, create the GitHub
# Release with all 67 artefacts attached (11 boards × 5 .bin + 1 elf .zip,
# plus SHA256SUMS), and publish the web flasher to Pages.
#
# Trigger:
#   git tag V2.4.2 && git push --tags
#       OR  Actions tab → "release" → "Run workflow" → enter the existing tag
#
# Gates run cheapest-first so a bad tag fails in seconds, not after an 11-board
# build: host-test + cppcheck + changelog preflight → build (merge + stage) →
# release → pages. The host-test and cppcheck gates and the board matrix are
# reusable workflows shared with build.yml (_host-test.yml / _cppcheck.yml /
# _build-boards.yml) so the two pipelines can't drift.
#
# Pages publishes only when the tag being released is the NEWEST release tag:
# a workflow_dispatch of an older tag (to re-upload its assets) must not roll
# the public web flasher back to old firmware.
#
# Pre-flight: don't push the tag until build.yml is green on the same commit. If
# a build fails AFTER the tag is pushed, the tag exists with no release —
# recoverable by deleting the tag, fixing, re-pushing.

name: release

on:
  push:
    tags:
      - 'V*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release (e.g. V2.4.2)'
        required: true

# See build.yml for the Node 20 → 24 deprecation rationale. (Reusable workflows
# don't inherit this — each repeats it.)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# Read-only by default; the two jobs that must write (release → contents,
# pages → pages/id-token) widen their own scope below.
permissions:
  contents: read

jobs:
  # Hard gates, shared with build.yml. Each checks out the tag being released
  # so the released commit's source is the one tested / analysed.
  host-test:
    uses: ./.github/workflows/_host-test.yml
    with:
      ref: ${{ github.event.inputs.tag || github.ref }}

  cppcheck:
    uses: ./.github/workflows/_cppcheck.yml
    with:
      ref: ${{ github.event.inputs.tag || github.ref }}

  # V2.5.31: fail FAST if CHANGELOG.md has no section for this tag. Pre-V2.5.31
  # this only surfaced as a warning in the release job AFTER all boards built
  # (minutes), shipping a placeholder release body (bit us on V2.4.2/.3). This
  # cheap check mirrors the heading match the extract step uses below.
  changelog-check:
    name: changelog preflight
    runs-on: ubuntu-latest
    # The tag reaches the shell ONLY through this env var: a workflow_dispatch
    # input interpolated straight into `run:` text would be executed verbatim.
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: Verify CHANGELOG.md has a section for the tag
        run: |
          set -e
          # changelog_section.sh is the single definition of "the section for
          # a tag", shared with the release-body extraction below, so this
          # preflight passes if and only if the extractor will find a
          # non-empty body — they can't disagree.
          if .github/scripts/changelog_section.sh "$TAG" >/dev/null; then
            echo "::notice::CHANGELOG.md section for ${TAG} present"
          else
            echo "::error::CHANGELOG.md has no '## ${TAG}' section — add release notes before tagging (the release body is extracted from it)."
            exit 1
          fi

      - name: No private data in the tag message or release notes
        run: |
          set -e
          # The release body is generated from CHANGELOG.md and the tag
          # annotation is public on the tag page — scan both with the same
          # script the push workflow runs on diffs (.github/scripts/pii_check.sh).
          git tag -l --format='%(contents)' "$TAG" | .github/scripts/pii_check.sh --stdin "tag $TAG"
          .github/scripts/changelog_section.sh "$TAG" | .github/scripts/pii_check.sh --stdin "CHANGELOG $TAG"

      - name: Board lists consistent
        run: .github/scripts/check_board_lists.sh

  # Reusable board matrix; release:true → build + merge-bin + VERSION_STR==tag
  # check + staged board-suffixed artefacts (release-<board>) for the release job.
  build:
    needs: [host-test, cppcheck, changelog-check]
    uses: ./.github/workflows/_build-boards.yml
    with:
      release: true
      ref: ${{ github.event.inputs.tag || github.ref }}
      tag: ${{ github.event.inputs.tag || github.ref_name }}

  release:
    name: create GitHub release
    needs: build
    runs-on: ubuntu-latest
    # `gh release create` needs write access to repository contents.
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Download all board artefacts
        uses: actions/download-artifact@v8
        with:
          path: artefacts/
          pattern: release-*
          # All boards' stages collapse into one flat artefacts/ dir.
          merge-multiple: true

      - name: Verify all artefacts present
        run: |
          set -e
          # KEEP IN SYNC with the matrix in _build-boards.yml. Each board
          # contributes exactly 6 files: 5 .bin (geiger_v2, _merged, bootloader,
          # partition-table, ota_data_initial) + 1 .zip (elf_<board> debug
          # symbols for coredump forensics). Independent guard on the count.
          # (The per-board count of 6 is unrelated to and does not need to
          # change with the number of boards — see EXPECTED_BOARDS below.)
          EXPECTED_BOARDS=11
          EXPECTED=$(( EXPECTED_BOARDS * 6 ))
          COUNT=$(find artefacts -maxdepth 1 -type f \( -name '*.bin' -o -name '*.zip' \) | wc -l)
          if [ "$COUNT" != "$EXPECTED" ]; then
            echo "::error::expected $EXPECTED artefacts ($EXPECTED_BOARDS boards × 6 per board: 5 .bin + 1 elf .zip), found $COUNT — update EXPECTED_BOARDS in release.yml if the matrix in _build-boards.yml changed"
            ls -la artefacts/
            exit 1
          fi
          echo "::notice::$EXPECTED artefacts staged"
          ls -la artefacts/

      - name: Write SHA256SUMS
        run: |
          set -e
          # One checksum file over every released artefact so a downloaded
          # image can be verified against the release page. Generated AFTER
          # the count check so it is never mistaken for a board artefact.
          (cd artefacts && sha256sum *.bin *.zip > SHA256SUMS)
          cat artefacts/SHA256SUMS

      - name: Extract release notes from CHANGELOG.md
        run: |
          set -e
          # Same script as the changelog-check preflight, which has already
          # failed the run if the section is missing; the fallback body below
          # is kept only as a belt-and-braces guard.
          .github/scripts/changelog_section.sh "$TAG" > release_notes.md || true
          if [ ! -s release_notes.md ]; then
            echo "::warning::no matching section in CHANGELOG.md for tag $TAG"
            {
              echo "Release notes not yet added to CHANGELOG.md for this tag."
              echo ""
              echo "See [the CHANGELOG](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) at the repo root."
            } > release_notes.md
          fi
          echo "--- release_notes.md preview (first 30 lines) ---"
          head -30 release_notes.md
          echo "--- end preview ---"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          # If a release already exists for this tag (re-run scenario), upload
          # assets to it instead of creating a duplicate.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::release $TAG already exists, uploading assets (--clobber)"
            gh release upload "$TAG" artefacts/*.bin artefacts/*.zip artefacts/SHA256SUMS --clobber
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --notes-file release_notes.md \
              artefacts/*.bin artefacts/*.zip artefacts/SHA256SUMS
          fi
          echo "::notice::release ready at $(gh release view "$TAG" --json url -q .url)"

  # ---------------------------------------------------------------------------
  # Publish the browser "web flasher" (docs/) + the 11 merged firmware images to
  # GitHub Pages, so https://<owner>.github.io/<repo>/ always serves an install
  # page wired to THIS release's binaries.
  #
  # Why Pages and not the release assets directly: ESP Web Tools fetches each
  # firmware part with a cross-origin fetch() and needs Access-Control-Allow-
  # Origin. GitHub *release* assets send no CORS header; GitHub *Pages* serves
  # `ACAO: *`. Publishing the merged bins onto Pages makes the fetch same-origin.
  #
  # ONE-TIME SETUP (repo owner): Settings → Pages → Source = "GitHub Actions".
  pages:
    name: deploy web flasher to Pages
    # Needs the merged bins (build) AND a published release (release): if
    # `gh release create` failed there must be no flasher advertising firmware
    # that has no release page behind it.
    needs: [build, release]
    runs-on: ubuntu-latest
    permissions:
      pages: write        # deploy-pages
      id-token: write      # OIDC token deploy-pages uses to authenticate
    # Serialise Pages deploys so two releases can't race the same environment.
    concurrency:
      group: "pages"
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        # NB: unlike build/release, this checkout intentionally does NOT use
        # inputs.tag. docs/ (web UI + manifests + vendored esp-web-tools) is a
        # *current* asset, not versioned firmware, so it tracks the workflow ref.
        # Checking out an older inputs.tag would 404 here when dispatching a tag
        # that predates docs/. The published firmware is still version-correct:
        # the bins come from the build job's artefacts of inputs.tag's source.
        uses: actions/checkout@v7

      - name: Only the newest release tag may publish the flasher
        id: gate
        run: |
          set -e
          # The flasher always serves "the latest release". Re-dispatching an
          # older tag (e.g. to re-upload its assets) must therefore leave Pages
          # alone; only the highest V<major>.<minor>.<patch> tag publishes.
          git fetch --tags --force --quiet
          NEWEST=$(git tag -l 'V*' | grep -E '^V[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1)
          if [ "$TAG" = "$NEWEST" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$TAG is the newest release tag — publishing the web flasher"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::warning::$TAG is not the newest release tag ($NEWEST) — release assets were published, the web flasher keeps serving $NEWEST"
          fi

      - name: Download built artefacts (for the merged bins)
        if: steps.gate.outputs.deploy == 'true'
        uses: actions/download-artifact@v8
        with:
          path: artefacts/
          pattern: release-*
          merge-multiple: true

      - name: Assemble Pages site (docs/ + firmware/)
        if: steps.gate.outputs.deploy == 'true'
        run: |
          set -e
          mkdir -p _site/firmware
          # The install page, manifests and vendored esp-web-tools.
          cp -r docs/. _site/
          # Only the merged (full-flash) images are what the web flasher writes.
          cp artefacts/geiger_v2_merged_*.bin _site/firmware/
          # Stamp the real version into the served manifests (repo files keep the
          # literal "latest"; only the published copies get the tag).
          sed -i "s/\"version\": \"latest\"/\"version\": \"$TAG\"/" _site/manifests/*.json
          # Cross-check before anything is served: every manifest must point at
          # a firmware file that exists, every merged image must be reachable
          # from some manifest, and the install page must list every manifest.
          # A board added to the build matrix but not to docs/ (or the reverse)
          # fails here instead of 404-ing in someone's browser.
          for m in _site/manifests/*.json; do
            for p in $(jq -r '.builds[].parts[].path' "$m"); do
              [ -f "_site/manifests/$p" ] || { echo "::error::$m references missing firmware $p"; exit 1; }
            done
            grep -qF "manifests/$(basename "$m")" _site/index.html \
              || { echo "::error::docs/index.html does not offer $(basename "$m")"; exit 1; }
          done
          for b in _site/firmware/geiger_v2_merged_*.bin; do
            grep -qF "$(basename "$b")" _site/manifests/*.json \
              || { echo "::error::no manifest references $(basename "$b")"; exit 1; }
          done
          echo "Published site tree:"
          find _site -maxdepth 2 -type f | sort

      - name: Upload Pages artifact
        if: steps.gate.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        if: steps.gate.outputs.deploy == 'true'
        id: deploy
        uses: actions/deploy-pages@v5
