# Managed component dependencies declared via the IDF Component Manager.
#
# ESP-MQTT (the `mqtt_client.h` library used by main/mqtt.c) was removed from
# bundled IDF components in v6.0 and is now distributed via the registry at
# https://components.espressif.com/components/espressif/mqtt — confirmed by
# `docs/en/migration-guides/release-6.x/6.0/protocols.rst` line 151. Pinned to
# an EXACT version (`==1.0.0`) in this committed manifest so dev + CI builds are
# reproducible WITHOUT committing `dependencies.lock` (which churns its `target:`
# field per board across our 5-target matrix — ignored since V2.5.13). Bump this
# deliberately when you want a newer esp-mqtt.
#
# Added V2.4.2 alongside the new mqtt.c module.

dependencies:
  idf:
    version: ">=6.0.2"
  espressif/mqtt: "==1.0.0"
  # V2.6.23: LoRaWAN stack — SX1262 driver + LoRaWAN 1.0.4/1.1 Class A MAC.
  # Pinned EXACT like espressif/mqtt (reproducible builds, no committed
  # dependencies.lock). Conditional on the GEIGER_LORAWAN kconfig symbol so
  # the ten non-LoRa boards never even download/compile the component.
  jgromes/radiolib:
    version: "==7.2.1"
    rules:
      - if: "$CONFIG{GEIGER_LORAWAN} == True"
