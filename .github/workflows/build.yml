# GitHub Actions: build all 4 board targets on every push + PR.
#
# Catches "broke board X while testing on Y" before a manual flash. Each
# job runs in parallel — failure of one board doesn't cancel the others
# (fail-fast: false), so a single push shows the full breakage matrix.
#
# Uses the official Espressif CI action (espressif/esp-idf-ci-action),
# which spins up the IDF Docker image and runs idf.py inside it. The
# IDF version pinned to v6.0 matches the local dev toolchain at
# C:\esp\v6.0\esp-idf (see [[reference_geiger_environment.md]]).
#
# Added in V2.4.1 (T2 — code-review item) — see CHANGELOG.md.

name: build

on:
  push:
    branches: [main]
    paths:
      - 'main/**'
      - 'test/**'
      - 'CMakeLists.txt'
      - 'sdkconfig.defaults*'
      - 'partitions*.csv'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - 'main/**'
      - 'test/**'
      - 'CMakeLists.txt'
      - 'sdkconfig.defaults*'
      - 'partitions*.csv'
      - '.github/workflows/**'
  workflow_dispatch: {}   # allow manual triggering from the Actions tab

jobs:
  # V2.4.1+ (T1): host-side unit tests for the pure helpers in main/util.h.
  # Runs first because it's cheap (~10 s) and a regression here likely
  # means the IDF builds will also fail — fail-fast on the cheap signal.
  # See test/test_main.c for the test cases.
  #
  # V2.4.1+ extension: valgrind sweep on the same binary catches leaks /
  # use-after-free / uninit-reads in the 5 pure helpers for free.
  host-test:
    name: host-test (pure helpers + valgrind)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install valgrind
        run: sudo apt-get update -qq && sudo apt-get install -y -qq valgrind

      - name: Build host tests
        run: |
          set -e
          # -g -O1 keeps debug info + lets valgrind report line numbers,
          # without the compiler optimising away the bugs valgrind catches.
          gcc -I main -Wall -Wextra -Werror -std=c11 -g -O1 \
              -o test/run test/test_main.c

      - name: Run host tests (native)
        run: ./test/run

      - name: Run host tests under valgrind
        run: |
          valgrind --error-exitcode=2 \
                   --leak-check=full \
                   --show-leak-kinds=all \
                   --track-origins=yes \
                   --errors-for-leak-kinds=all \
                   ./test/run

  # V2.4.1+ (T3): cppcheck static analysis on main/. Pure C analysis,
  # no IDF headers needed. Currently informational only — `continue-on-error`
  # is true so the job's findings show in the step summary without
  # turning the workflow red. Promote to fail-on-error after the first
  # triage pass cleans the baseline.
  static-analysis:
    name: cppcheck (informational)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cppcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq cppcheck

      - name: Run cppcheck on main/
        continue-on-error: true
        run: |
          set +e
          # --enable: include warning/style/performance/portability findings.
          # Suppressions:
          #   missingIncludeSystem  — we don't ship IDF headers in this check
          #   unusedFunction        — many entry points are IDF/FreeRTOS
          #                            callbacks cppcheck can't see being called
          #   unusedStructMember    — struct members read via memcpy or by
          #                            external IDF code
          #   internalAstError      — known cppcheck issue with some macros
          # -DESP_PLATFORM=1 mirrors the real build's macro definition.
          cppcheck \
            --enable=warning,style,performance,portability \
            --inline-suppr \
            --suppress=missingIncludeSystem \
            --suppress=unusedFunction \
            --suppress=unusedStructMember \
            --suppress=internalAstError \
            --quiet \
            --error-exitcode=1 \
            -DESP_PLATFORM=1 \
            -I main \
            main/ 2>&1 | tee cppcheck.out
          RC=${PIPESTATUS[0]}
          {
            echo "## cppcheck findings"
            if [ -s cppcheck.out ]; then
              echo '```'
              cat cppcheck.out
              echo '```'
            else
              echo "_(clean — no findings at warning/style/performance/portability levels)_"
            fi
            echo ""
            echo "cppcheck exit code: $RC (0=clean)"
          } >> "$GITHUB_STEP_SUMMARY"
          # Informational: don't fail the job. Promote to `exit $RC` after
          # the baseline is clean.
          exit 0

      - name: Upload cppcheck output as artifact
        uses: actions/upload-artifact@v4
        with:
          name: cppcheck-${{ github.sha }}
          path: cppcheck.out
          if-no-files-found: ignore
          retention-days: 14

  build:
    name: build / ${{ matrix.board }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board:
          - heltec_v2
          - heltec_v2_4mb
          - feathers3_d
          - adafruit_qtpy_esp32_pico

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.0
          # Determine target chip from BOARD (mirrors CMakeLists.txt's
          # IDF_TARGET selection — kept in sync manually).
          target: ${{ startsWith(matrix.board, 'heltec_v2') && 'esp32' || (matrix.board == 'feathers3_d' && 'esp32s3' || 'esp32') }}
          path: '.'
          # idf.py invocation — same form as local _build.cmd. Build dir
          # is per-board so multiple jobs on the same runner (if matrix
          # ever runs sequentially) don't clobber each other.
          command: idf.py -B build_${{ matrix.board }} -DBOARD=${{ matrix.board }} build

      - name: Report binary size
        run: |
          set -e
          BIN="build_${{ matrix.board }}/geiger_v2.bin"
          if [ ! -f "$BIN" ]; then
            echo "::error::binary not produced at $BIN"
            exit 1
          fi
          SIZE=$(stat -c%s "$BIN")
          HEX=$(printf '0x%x' "$SIZE")
          echo "::notice::${{ matrix.board }} geiger_v2.bin = $SIZE bytes ($HEX)"
          echo "## ${{ matrix.board }}" >> "$GITHUB_STEP_SUMMARY"
          echo "geiger_v2.bin: **$SIZE bytes** ($HEX)" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify VERSION_STR embedded
        run: |
          set -e
          # Sanity check: the binary really has the version string from
          # main/version.h baked in. Catches the cache-staleness bug from
          # V2.3.10/.11 (App version skew) before it reaches a flash.
          VER=$(grep -oP 'VERSION_STR[ \t]+"\K[^"]+' main/version.h)
          if ! strings "build_${{ matrix.board }}/geiger_v2.bin" | grep -qF "$VER"; then
            echo "::error::expected VERSION_STR '$VER' not found in binary"
            exit 1
          fi
          echo "::notice::${{ matrix.board }} binary contains VERSION_STR=$VER"

      - name: Upload binary as artifact
        uses: actions/upload-artifact@v4
        with:
          name: geiger_v2_${{ matrix.board }}_${{ github.sha }}
          path: |
            build_${{ matrix.board }}/geiger_v2.bin
            build_${{ matrix.board }}/bootloader/bootloader.bin
            build_${{ matrix.board }}/partition_table/partition-table.bin
            build_${{ matrix.board }}/ota_data_initial.bin
          if-no-files-found: error
          retention-days: 14
