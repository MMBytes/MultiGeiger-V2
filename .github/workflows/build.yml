# GitHub Actions: host tests + static analysis + build all 6 board targets on
# every push to main + PR.
#
# Catches "broke board X while testing on Y" before a manual flash. The cppcheck
# gate and the board matrix live in reusable workflows (_cppcheck.yml /
# _build-boards.yml) shared with release.yml, so the two pipelines can't drift.
#
# The IDF version is pinned in _build-boards.yml to v6.0.1 (matches the local
# dev toolchain). Must be >= idf_component.yml's `idf: ">=6.0.1"` constraint.
#
# Added in V2.4.1 (T2); reusable-workflow refactor + concurrency in V2.5.31.

name: build

on:
  push:
    branches: [main]
    paths:
      - 'main/**'
      - 'test/**'
      - 'CMakeLists.txt'
      - 'sdkconfig.defaults*'
      - 'partitions*.csv'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - 'main/**'
      - 'test/**'
      - 'CMakeLists.txt'
      - 'sdkconfig.defaults*'
      - 'partitions*.csv'
      - '.github/workflows/**'
  workflow_dispatch: {}   # allow manual triggering from the Actions tab

# Force all JavaScript-based actions (checkout, upload-artifact,
# esp-idf-ci-action, ...) to run under Node.js 24 instead of the default
# Node.js 20. GitHub deprecates Node 20 on the runners 2026-06-02 (forced
# default) / 2026-09-16 (removed). Setting the opt-in env here covers every JS
# action without per-action version bumps. Drop once Node 24 is the default.
# NB: reusable workflows don't inherit this — it's repeated in each.
# See: https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# V2.5.31: cancel a superseded in-flight run when a newer commit lands on the
# same branch/PR — no point finishing a 6-board build for code already replaced.
# (release.yml deliberately has NO cancel-in-progress: never abort a release.)
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # V2.4.1+ (T1): host-side unit tests for the pure helpers in main/util.h +
  # main/tube_logic.h. Runs first because it's cheap (~10 s) and a regression
  # here likely means the IDF builds will also fail — fail-fast on the cheap
  # signal. See test/test_main.c for the cases.
  #
  # The valgrind sweep on the same binary catches leaks / use-after-free /
  # uninit-reads in the pure helpers for free.
  host-test:
    name: host-test (pure helpers + valgrind)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install valgrind
        run: sudo apt-get update -qq && sudo apt-get install -y -qq valgrind

      - name: Build host tests
        run: |
          set -e
          # -g -O1 keeps debug info + lets valgrind report line numbers,
          # without the compiler optimising away the bugs valgrind catches.
          gcc -I main -Wall -Wextra -Werror -std=c11 -g -O1 \
              -o test/run test/test_main.c

      - name: Run host tests (native)
        run: ./test/run

      - name: Run host tests under valgrind
        run: |
          valgrind --error-exitcode=2 \
                   --leak-check=full \
                   --show-leak-kinds=all \
                   --track-origins=yes \
                   --errors-for-leak-kinds=all \
                   ./test/run

  # V2.4.1+ (T3): cppcheck static analysis — reusable gate shared with
  # release.yml so the baseline can't drift. Informational until 2026-05-17,
  # now a hard gate (new findings fail the job).
  cppcheck:
    uses: ./.github/workflows/_cppcheck.yml

  # V2.4.1+ (T2): build all board targets. Reusable matrix shared with
  # release.yml; release:false → CI build (size report + per-board artefacts,
  # no merge-bin / staging). Independent of host-test/cppcheck so one run shows
  # every signal in parallel.
  build:
    uses: ./.github/workflows/_build-boards.yml
    with:
      release: false
