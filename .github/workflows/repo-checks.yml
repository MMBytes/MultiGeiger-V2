# Repository checks that must run on EVERY push and PR, not just the ones
# that touch firmware (build.yml is path-filtered to main/, test/, CMake,
# sdkconfig and partition files — a README, CHANGELOG, docs/ or .gitignore
# change never reaches it).
#
#   pii-check    — the lines this push ADDS, and its commit messages, carry no
#                  private-network data. See .github/scripts/pii_check.sh for
#                  the patterns and why they are generic. The same script is
#                  the optional local pre-commit hook (.githooks/pre-commit).
#   board-lists  — the eleven board names agree across the nine places they
#                  are spelled out. See .github/scripts/check_board_lists.sh.

name: repo-checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

# A PR run recomputes the whole merge-base..HEAD delta, so a superseded one can
# be cancelled. A push run scans before..HEAD of THAT push: cancelling it when
# a second push lands would leave the first push's lines and messages
# unscanned by any run, so push runs always complete.
concurrency:
  group: repo-checks-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pii-check:
    name: no private data in added lines
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for the range diff)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan the pushed range
        run: |
          set -e
          case "${{ github.event_name }}" in
            pull_request)
              RANGE="origin/${{ github.base_ref }}...HEAD" ;;
            push)
              BEFORE="${{ github.event.before }}"
              # A brand-new branch or a force-push reports an all-zero or
              # unknown "before"; fall back to the last commit only.
              if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
                 || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
                RANGE="HEAD~1..HEAD"
              else
                RANGE="$BEFORE..HEAD"
              fi ;;
            *)
              RANGE="HEAD~1..HEAD" ;;
          esac
          echo "scanning $RANGE"
          .github/scripts/pii_check.sh --range "$RANGE"

  board-lists:
    name: board lists consistent
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Compare every board list against CMakeLists.txt
        run: .github/scripts/check_board_lists.sh
