# Release workflow — fire on tag push, build all 10 boards, create the GitHub
# Release with all 50 artefacts attached, and publish the web flasher to Pages.
#
# Trigger:
#   git tag V2.4.2 && git push --tags
#       OR  Actions tab → "release" → "Run workflow" → enter the existing tag
#
# Gates run cheapest-first so a bad tag fails in seconds, not after a 10-board
# build: cppcheck + changelog preflight → build (merge + stage) → release → pages.
# The cppcheck gate and the board matrix are reusable workflows shared with
# build.yml (_cppcheck.yml / _build-boards.yml) so the two pipelines can't drift.
#
# Pre-flight: don't push the tag until build.yml is green on the same commit. If
# a build fails AFTER the tag is pushed, the tag exists with no release —
# recoverable by deleting the tag, fixing, re-pushing.

name: release

on:
  push:
    tags:
      - 'V*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release (e.g. V2.4.2)'
        required: true

# See build.yml for the Node 20 → 24 deprecation rationale. (Reusable workflows
# don't inherit this — each repeats it.)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # Hard gate, shared with build.yml. Checks out the tag being released so the
  # released commit's source is the one analysed.
  cppcheck:
    uses: ./.github/workflows/_cppcheck.yml
    with:
      ref: ${{ github.event.inputs.tag || github.ref }}

  # V2.5.31: fail FAST if CHANGELOG.md has no section for this tag. Pre-V2.5.31
  # this only surfaced as a warning in the release job AFTER all boards built
  # (minutes), shipping a placeholder release body (bit us on V2.4.2/.3). This
  # cheap check mirrors the heading match the extract step uses below.
  changelog-check:
    name: changelog preflight
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: Verify CHANGELOG.md has a section for the tag
        run: |
          set -e
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          # Use the SAME heading match the extract step (release job) uses, so
          # this preflight passes if and only if the extractor will find a
          # non-empty body — they can't disagree. (Both accept a bare "## TAG"
          # heading or "## TAG <sep> title"; the [^0-9A-Za-z] boundary stops
          # V2.4.1 matching V2.4.10.)
          if awk -v ver="$TAG" '
            /^## / && ($0 == "## " ver || $0 ~ "^## " ver "[^0-9A-Za-z]") { found=1; exit }
            END { exit(found ? 0 : 1) }
          ' CHANGELOG.md; then
            echo "::notice::CHANGELOG.md section for ${TAG} present"
          else
            echo "::error::CHANGELOG.md has no '## ${TAG}' section — add release notes before tagging (the release body is extracted from it)."
            exit 1
          fi

  # Reusable board matrix; release:true → build + merge-bin + VERSION_STR==tag
  # check + staged board-suffixed artefacts (release-<board>) for the release job.
  build:
    needs: [cppcheck, changelog-check]
    uses: ./.github/workflows/_build-boards.yml
    with:
      release: true
      ref: ${{ github.event.inputs.tag || github.ref }}
      tag: ${{ github.event.inputs.tag || github.ref_name }}

  release:
    name: create GitHub release
    needs: build
    runs-on: ubuntu-latest
    # `gh release create` needs write access to repository contents.
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Download all board artefacts
        uses: actions/download-artifact@v8
        with:
          path: artefacts/
          pattern: release-*
          # All boards' stages collapse into one flat artefacts/ dir.
          merge-multiple: true

      - name: Verify all artefacts present
        run: |
          set -e
          # KEEP IN SYNC with the matrix in _build-boards.yml. Each board
          # contributes exactly 5 .bin files: geiger_v2, _merged, bootloader,
          # partition-table, ota_data_initial. Independent guard on the count.
          # (The per-board count of 5 is unrelated to and does not need to
          # change with the number of boards — see EXPECTED_BOARDS below.)
          EXPECTED_BOARDS=10
          EXPECTED=$(( EXPECTED_BOARDS * 5 ))
          COUNT=$(find artefacts -maxdepth 1 -type f -name '*.bin' | wc -l)
          if [ "$COUNT" != "$EXPECTED" ]; then
            echo "::error::expected $EXPECTED .bin artefacts ($EXPECTED_BOARDS boards × 5 per board), found $COUNT — update EXPECTED_BOARDS in release.yml if the matrix in _build-boards.yml changed"
            ls -la artefacts/
            exit 1
          fi
          echo "::notice::$EXPECTED artefacts staged"
          ls -la artefacts/

      - name: Extract release notes from CHANGELOG.md
        run: |
          set -e
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          # Extract the section between "## TAG" and the next "## ".
          #
          # Match two heading shapes:
          #   * "## V2.4.2"           — heading with no trailing text
          #   * "## V2.4.2 — title"   — heading with a separator + label
          #     (the trailing `[^0-9A-Za-z]` check on the next char prevents
          #     V2.4.1 from also matching V2.4.10).
          # The bug pre-V2.4.4 was matching only the second shape, so bare-
          # heading sections released with the placeholder. The changelog-check
          # job above fails the run before here if the section is missing.
          #
          # `sed` post-processor: drop any trailing `---` horizontal rule +
          # blank lines between version sections so they don't look like noise
          # at the bottom of the release page.
          awk -v ver="$TAG" '
            /^## / {
              if (in_section) exit
              if ($0 == "## " ver || $0 ~ "^## " ver "[^0-9A-Za-z]") { in_section = 1; next }
            }
            in_section { print }
          ' CHANGELOG.md \
            | sed -e :a -e '/^[[:space:]-]*$/{$d;N;ba' -e '}' \
            > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "::warning::no matching section in CHANGELOG.md for tag $TAG"
            {
              echo "Release notes not yet added to CHANGELOG.md for this tag."
              echo ""
              echo "See [the CHANGELOG](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) at the repo root."
            } > release_notes.md
          fi
          echo "--- release_notes.md preview (first 30 lines) ---"
          head -30 release_notes.md
          echo "--- end preview ---"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          # If a release already exists for this tag (re-run scenario), upload
          # assets to it instead of creating a duplicate.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::release $TAG already exists, uploading assets (--clobber)"
            gh release upload "$TAG" artefacts/*.bin --clobber
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --notes-file release_notes.md \
              artefacts/*.bin
          fi
          echo "::notice::release ready at $(gh release view "$TAG" --json url -q .url)"

  # ---------------------------------------------------------------------------
  # Publish the browser "web flasher" (docs/) + the 10 merged firmware images to
  # GitHub Pages, so https://<owner>.github.io/<repo>/ always serves an install
  # page wired to THIS release's binaries.
  #
  # Why Pages and not the release assets directly: ESP Web Tools fetches each
  # firmware part with a cross-origin fetch() and needs Access-Control-Allow-
  # Origin. GitHub *release* assets send no CORS header; GitHub *Pages* serves
  # `ACAO: *`. Publishing the merged bins onto Pages makes the fetch same-origin.
  #
  # ONE-TIME SETUP (repo owner): Settings → Pages → Source = "GitHub Actions".
  pages:
    name: deploy web flasher to Pages
    needs: build          # needs the merged bins; build itself gates on cppcheck + changelog
    runs-on: ubuntu-latest
    permissions:
      pages: write        # deploy-pages
      id-token: write      # OIDC token deploy-pages uses to authenticate
    # Serialise Pages deploys so two releases can't race the same environment.
    concurrency:
      group: "pages"
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        # NB: unlike build/release, this checkout intentionally does NOT use
        # inputs.tag. docs/ (web UI + manifests + vendored esp-web-tools) is a
        # *current* asset, not versioned firmware, so it tracks the workflow ref.
        # Checking out an older inputs.tag would 404 here when dispatching a tag
        # that predates docs/. The published firmware is still version-correct:
        # the bins come from the build job's artefacts of inputs.tag's source.
        uses: actions/checkout@v7

      - name: Download built artefacts (for the merged bins)
        uses: actions/download-artifact@v8
        with:
          path: artefacts/
          pattern: release-*
          merge-multiple: true

      - name: Assemble Pages site (docs/ + firmware/)
        run: |
          set -e
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          mkdir -p _site/firmware
          # The install page, manifests and vendored esp-web-tools.
          cp -r docs/. _site/
          # Only the merged (full-flash) images are what the web flasher writes.
          cp artefacts/geiger_v2_merged_*.bin _site/firmware/
          # Stamp the real version into the served manifests (repo files keep the
          # literal "latest"; only the published copies get the tag).
          sed -i "s/\"version\": \"latest\"/\"version\": \"$TAG\"/" _site/manifests/*.json
          echo "Published site tree:"
          find _site -maxdepth 2 -type f | sort

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
